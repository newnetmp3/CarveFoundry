name: Rust Reboot

on:
  push:
    branches: [main, rust-reboot]
  pull_request:
    branches: [main, rust-reboot]
  workflow_dispatch:

jobs:
  rust-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Rust geometry, project and editing tests
        run: cargo test --workspace
      - name: Strict Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Native Linux release build
        run: cargo build --release -p carvefoundry-studio
