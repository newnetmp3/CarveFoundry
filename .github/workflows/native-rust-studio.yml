name: Native Rust Studio

on:
  pull_request:
    paths:
      - "rust-ui/**"
      - "scripts/run-rust-studio.sh"
      - "scripts/install-rust-studio.sh"
      - ".github/workflows/native-rust-studio.yml"
  push:
    paths:
      - "rust-ui/**"
      - "scripts/run-rust-studio.sh"
      - "scripts/install-rust-studio.sh"
      - ".github/workflows/native-rust-studio.yml"

jobs:
  rust-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-ui
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev pkg-config
      - name: Format sources for compiler verification
        run: cargo fmt --manifest-path rust-ui/Cargo.toml
      - name: Rust geometry and layout tests
        run: cargo test --manifest-path rust-ui/Cargo.toml --all-targets
      - name: Check strict Rust warnings
        run: cargo clippy --manifest-path rust-ui/Cargo.toml --all-targets -- -D warnings
      - name: Build native Linux studio
        run: cargo build --manifest-path rust-ui/Cargo.toml --release
      - name: Validate launcher shell syntax
        run: bash -n scripts/run-rust-studio.sh scripts/install-rust-studio.sh
