name: CarveFoundry Web checks

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"

jobs:
  browser-and-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Test isolated Rust CAM preview
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Install web frontend packages
        run: npm install --no-audit --no-fund
      - name: Build web frontend with WebAssembly
        run: npm run build
      - name: Validate isolated deployment scripts
        run: |
          node --check scripts/provision-cloudflare.mjs
          bash -n scripts/attach-domain.sh
      - name: Confirm compiled browser artifact
        run: |
          test -s dist/index.html
          test -f src/wasm/pkg/carvefoundry_web_engine_bg.wasm
          ! grep -R -i -E 'python|pyside6' package.json
