<title id="roadmap-title">CarveFoundry Rust roadmap R0 through R7</title>
<desc id="roadmap-desc">R0 Rust foundation implemented. R1 2D vector CAD in progress, source-exact convex rounded offsets and remaining desktop CAD QA. R2 3D geometry, R3 CNC job tools, R4 2D CAM, R5 3D CAM, and R7 production QA planned. R6 machine safety and NC export locked.</desc>
