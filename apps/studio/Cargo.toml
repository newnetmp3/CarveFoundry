[package]
name = "carvefoundry-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CarveFoundry native Rust CAD/CAM desktop (safe CAD foundation)"

[dependencies]
carvefoundry-core = { path = "../../crates/core" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Native KDE/Wayland file chooser via XDG desktop portal (no GTK3 build dependency).
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

# Discover installed system font faces. No fonts are bundled with CarveFoundry.
fontdb = "0.24"
