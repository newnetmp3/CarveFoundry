[package]
name = "carvefoundry-web-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Browser-only CNC toolpath preview engine for CarveFoundry Web"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = "1"
