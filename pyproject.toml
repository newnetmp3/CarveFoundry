[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "carvefoundry"
version = "0.1.0"
description = "Native Linux CNC design and CAM application"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "CarveFoundry contributors"}]
dependencies = [
  "PySide6>=6.8",
  "numpy>=2.0",
  "trimesh>=4.5",
  "networkx>=3.3",
  "shapely>=2.0",
  "mapbox-earcut>=1.0.3",
  "ezdxf>=1.3",
  "svgpathtools>=1.6",
  "zstandard>=0.23",
]

[project.optional-dependencies]
ai = [
  "Pillow>=10.0",
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.45",
  "diffusers>=0.30",
  "accelerate>=1.0",
]
dev = [
  "Pillow>=10.0",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
carvefoundry = "carvefoundry.app:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "carvefoundry._native"
editable-profile = "release"
strip = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
