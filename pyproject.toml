[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "carvefoundry"
version = "0.1.0"
description = "Native Linux CNC design and CAM application"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "CarveFoundry contributors"}]
dependencies = [
  "PySide6>=6.8",
  "numpy>=2.0",
  "trimesh>=4.5",
  "shapely>=2.0",
  "ezdxf>=1.3",
  "svgpathtools>=1.6",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
carvefoundry = "carvefoundry.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carvefoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
